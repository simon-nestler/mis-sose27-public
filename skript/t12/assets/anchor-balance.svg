<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">The anchor balance: T03 context procedure, T08 conversation decision, T10 legal frame and T11 substitution logic converge on one object — the public terminal</title>
  <desc id="d">Four labeled boxes on the left — T03 the context procedure, T08 the conversation decision, T10 the legal frame, T11 the substitution logic — each with an arrow pointing to a schematic self-service terminal on the right, labeled one object: the public terminal. A footer line states that nothing here is new; the second anchor is where the semester converges.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .src { font-size: 30px; font-weight: 700; }
    .obj { font-size: 26px; font-weight: 700; }
    .objsub { font-size: 20px; fill: #5a6472; }
    .foot { font-size: 20px; fill: #5a6472; }
    .box { fill: #e5effb; stroke: #c7cdd4; stroke-width: 2; }
    .mark { fill: #fcd430; }
    .arrow { stroke: #031121; stroke-width: 2.5; fill: none; }
    .hw { fill: #ffffff; stroke: #5a6472; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#031121"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <rect class="box" x="70" y="62" width="430" height="96"/>
  <rect class="mark" x="100" y="101" width="18" height="18"/>
  <text class="src" x="138" y="120">T03 · the context procedure</text>

  <rect class="box" x="70" y="190" width="430" height="96"/>
  <rect class="mark" x="100" y="229" width="18" height="18"/>
  <text class="src" x="138" y="248">T08 · the conversation decision</text>

  <rect class="box" x="70" y="318" width="430" height="96"/>
  <rect class="mark" x="100" y="357" width="18" height="18"/>
  <text class="src" x="138" y="376">T10 · the legal frame</text>

  <rect class="box" x="70" y="446" width="430" height="96"/>
  <rect class="mark" x="100" y="485" width="18" height="18"/>
  <text class="src" x="138" y="504">T11 · the substitution logic</text>

  <path class="arrow" d="M505 110 L845 200" marker-end="url(#arr)"/>
  <path class="arrow" d="M505 238 L845 270" marker-end="url(#arr)"/>
  <path class="arrow" d="M505 366 L845 340" marker-end="url(#arr)"/>
  <path class="arrow" d="M505 494 L845 410" marker-end="url(#arr)"/>

  <rect x="860" y="120" width="220" height="380" rx="10" fill="#e5effb" stroke="#5a6472" stroke-width="2.5"/>
  <rect class="hw" x="890" y="150" width="160" height="120"/>
  <rect class="mark" x="890" y="290" width="70" height="16"/>
  <rect class="hw" x="890" y="330" width="70" height="18"/>
  <rect class="hw" x="890" y="430" width="160" height="42"/>

  <text class="obj" x="970" y="540" text-anchor="middle">one object</text>
  <text class="objsub" x="970" y="568" text-anchor="middle">the public terminal</text>

  <text class="foot" x="70" y="606">Nothing here is new — the second anchor is where the semester converges.</text>
</svg>
