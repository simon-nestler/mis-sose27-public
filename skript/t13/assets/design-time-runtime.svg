<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Design time versus runtime: before this week the interface existed as an artifact that could be reviewed before use; a generative UI is assembled by the model at the moment of use, so nothing exists to check — the responsibility remains in both rows</title>
  <desc id="d">Two horizontal flows of four stages each. Top row, design time: the designer, the artifact, the review, the use — connected by arrows. Bottom row, runtime: intent plus context, the model, then a dashed empty stage marked nothing exists to check, highlighted in yellow, then the action. A footer states that what does not disappear with the artifact is the responsibility.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .row { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #1a2f6e; }
    .sub { font-size: 17px; fill: #5a6472; }
    .stage { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .gap { font-size: 20px; font-weight: 700; text-anchor: middle; }
    .foot { font-size: 21px; font-weight: 700; }
    .box { fill: #e5effb; stroke: #c7cdd4; stroke-width: 2; }
    .box2 { fill: #f2f6fa; stroke: #c7cdd4; stroke-width: 2; }
    .arrow { stroke: #1a2f6e; stroke-width: 3; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2f6e"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- Row 1: design time -->
  <text class="row" x="60" y="58">DESIGN TIME — T01 TO T12</text>
  <text class="sub" x="60" y="84">the interface exists before the user arrives — it can be reviewed before use</text>

  <rect class="box" x="60"  y="100" width="220" height="80" rx="8"/>
  <text class="stage" x="170" y="148">the designer</text>
  <line class="arrow" x1="288" y1="140" x2="342" y2="140"/>

  <rect class="box" x="350" y="100" width="220" height="80" rx="8"/>
  <text class="stage" x="460" y="148">the artifact</text>
  <line class="arrow" x1="578" y1="140" x2="632" y2="140"/>

  <rect class="box" x="640" y="100" width="220" height="80" rx="8"/>
  <text class="stage" x="750" y="148">the review</text>
  <line class="arrow" x1="868" y1="140" x2="922" y2="140"/>

  <rect class="box" x="930" y="100" width="220" height="80" rx="8"/>
  <text class="stage" x="1040" y="148">the use</text>

  <!-- Row 2: runtime -->
  <text class="row" x="60" y="308">RUNTIME — TODAY</text>
  <text class="sub" x="60" y="334">the interface is assembled at the moment of use — different every time</text>

  <rect class="box2" x="60"  y="350" width="220" height="80" rx="8"/>
  <text class="stage" x="170" y="398">intent + context</text>
  <line class="arrow" x1="288" y1="390" x2="342" y2="390"/>

  <rect class="box2" x="350" y="350" width="220" height="80" rx="8"/>
  <text class="stage" x="460" y="398">the model</text>
  <line class="arrow" x1="578" y1="390" x2="632" y2="390"/>

  <rect x="640" y="350" width="220" height="80" rx="8" fill="none" stroke="#fcd430" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="gap" x="750" y="384">nothing exists</text>
  <text class="gap" x="750" y="410">to check</text>
  <line class="arrow" x1="868" y1="390" x2="922" y2="390"/>

  <rect class="box2" x="930" y="350" width="220" height="80" rx="8"/>
  <text class="stage" x="1040" y="398">the action</text>

  <!-- Footer -->
  <rect x="60" y="544" width="18" height="18" fill="#fcd430"/>
  <text class="foot" x="92" y="560">What does not disappear with the artifact: the responsibility.</text>
</svg>
