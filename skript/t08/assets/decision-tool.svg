<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">The decision tool: interaction cost times error consequences times articulability</title>
  <desc id="d">Three boxes in a row, joined by multiplication signs: interaction cost (what does this path cost the user?), error consequences (what happens when recognition fails?), articulability (can this user articulate this goal?). A footer line states that the three questions are asked in order, per case, ignoring camp defaults.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .factor { font-size: 30px; font-weight: 700; }
    .q { font-size: 21px; fill: #5a6472; }
    .times { font-size: 46px; font-weight: 700; fill: #031121; }
    .foot { font-size: 20px; fill: #5a6472; }
    .box { fill: #e5effb; stroke: #c7cdd4; stroke-width: 2; }
    .mark { fill: #fcd430; }
  </style>
  <rect width="1200" height="620" fill="#ffffff"/>

  <rect class="box" x="60" y="180" width="320" height="240"/>
  <rect class="mark" x="90" y="242" width="18" height="18"/>
  <text class="factor" x="120" y="260">interaction</text>
  <text class="factor" x="120" y="298">cost</text>
  <text class="q" x="90" y="352">What does this path</text>
  <text class="q" x="90" y="380">cost the user?</text>

  <text class="times" x="415" y="316" text-anchor="middle">&#215;</text>

  <rect class="box" x="450" y="180" width="320" height="240"/>
  <rect class="mark" x="480" y="242" width="18" height="18"/>
  <text class="factor" x="510" y="260">error</text>
  <text class="factor" x="510" y="298">consequences</text>
  <text class="q" x="480" y="352">What happens when</text>
  <text class="q" x="480" y="380">recognition fails?</text>

  <text class="times" x="805" y="316" text-anchor="middle">&#215;</text>

  <rect class="box" x="840" y="180" width="320" height="240"/>
  <rect class="mark" x="870" y="242" width="18" height="18"/>
  <text class="factor" x="900" y="260">articulability</text>
  <text class="q" x="870" y="322">Can this user</text>
  <text class="q" x="870" y="350">articulate</text>
  <text class="q" x="870" y="378">this goal?</text>

  <text class="foot" x="60" y="560">Three questions per case, asked in order &#8212; the camps&#8217; defaults are ignored, the case is interrogated.</text>
</svg>
