<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 851" role="img" aria-labelledby="t d">
  <title id="t">The MIS semester plan: session 0, 13 sessions of 135 minutes, two anchors, six exercise blocks with a reserve date, prototype milestones, mock exam and written exam</title>
  <desc id="d">Highlighted (yellow frame, tag TODAY): field 5. Fifteen fields in three rows, read left to right. Session 0 comes first, dashed. Then the sessions: T01 The Invisible Interface; T02 Combining Modalities; T03 Context of Use; T04 Touch Gestures and Recognition Errors; T05 In-Air Gestures, dropped second; T06 Anchor I, the car case; T07 Voice Dialogs, Written and Generated; T08 Chat and the Articulation Barrier; T09 The Audit Workshop, dropped first; T10 Accessibility, Law and Checking; T11 Modality Substitution; T12 Anchor II, the terminal for everyone; T13 Interfaces at Runtime. T06 and T12 are dark anchors. Blue tags below the sessions show the exercise blocks of 180 minutes and the session each docks to: exercise 1 toolchain at T02, exercise 2 gestures at T04 and T05, exercise 3 voice at T07, exercise 4 integration at T08 and T06, exercise 5 accessibility audit at T10 and T11, exercise 6 user test at T12. A dashed tag under T13 marks the seventh date, a catch-up block in reserve. Yellow tags mark the milestones: team and project idea in exercise 1, the working multimodal prototype in exercise 4, the mock exam in T13, the written exam of 90 minutes. A dashed field after T13: an extra week becomes a question hour.</desc>
