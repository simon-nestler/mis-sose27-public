<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" role="img" aria-labelledby="t d">
  <title id="t">Schema: Gaze + Pinch — the gaze aims, a minimal pinch confirms, the arm never rises</title>
  <desc id="d">A head in profile sends a dashed gaze ray to a highlighted target in an interface panel: step 1, the gaze aims. Low in the picture a hand performs a small thumb-to-index pinch; a solid arrow from the pinch to the target marks step 2, the pinch confirms. A note states that the arm never rises.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .l { font-size: 22px; font-weight: 700; fill: #1a2f6e; }
    .s { font-size: 17px; fill: #5a6472; }
    .gaze { fill: none; stroke: #3391ff; stroke-width: 3.5; stroke-dasharray: 9 7; marker-end: url(#arrowblue); }
    .confirm { fill: none; stroke: #1a2f6e; stroke-width: 3; marker-end: url(#arrowdark); }
    .finger { fill: none; stroke: #031121; stroke-width: 12; stroke-linecap: round; }
    .row { fill: #f5f3ee; stroke: #c7cdd4; stroke-width: 1.5; }
    .bar { fill: #c7cdd4; }
  </style>
  <defs>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3391ff"/></marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2f6e"/></marker>
  </defs>
  <rect width="1260" height="560" fill="#ffffff"/>

  <!-- head in profile -->
  <circle cx="190" cy="210" r="80" fill="#e5effb" stroke="#c7cdd4" stroke-width="2"/>
  <path d="M262,196 l16,10 -14,12" fill="none" stroke="#c7cdd4" stroke-width="2"/>
  <circle cx="232" cy="188" r="8" fill="#031121"/>

  <!-- gaze ray -->
  <line class="gaze" x1="248" y1="186" x2="928" y2="152"/>
  <text class="l" x="440" y="132">1 · the gaze aims</text>

  <!-- interface panel with target -->
  <rect x="930" y="78" width="260" height="244" fill="#ffffff" stroke="#c7cdd4" stroke-width="2"/>
  <rect class="row" x="950" y="98" width="220" height="54"/>
  <rect class="bar" x="966" y="120" width="120" height="10"/>
  <rect x="950" y="170" width="220" height="54" fill="#e5effb" stroke="#c7cdd4" stroke-width="1.5"/>
  <rect class="bar" x="966" y="192" width="140" height="10"/>
  <rect x="944" y="164" width="232" height="66" rx="6" fill="none" stroke="#3391ff" stroke-width="4"/>
  <rect class="row" x="950" y="242" width="220" height="54"/>
  <rect class="bar" x="966" y="264" width="100" height="10"/>
  <text class="s" x="950" y="352">the gaze target</text>

  <!-- pinch hand, low -->
  <line class="finger" x1="622" y1="368" x2="572" y2="424"/>
  <line class="finger" x1="508" y1="472" x2="564" y2="432"/>
  <circle cx="568" cy="428" r="9" fill="#fcd430" stroke="#031121" stroke-width="2"/>
  <line class="confirm" x1="600" y1="408" x2="936" y2="210"/>
  <text class="l" x="622" y="330">2 · a minimal pinch confirms</text>
  <text class="s" x="428" y="505">the arm never rises — the hand stays low, the pinch is tiny</text>
</svg>
